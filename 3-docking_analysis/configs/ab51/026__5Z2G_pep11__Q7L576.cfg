# HADDOCK3 protein-peptide scoring run.
# Generated by r_dock_hd/prepare_haddock_inputs.py.

run_dir = "run_peptide_score"
mode = "local"
ncores = 12

molecules = [
  "input/receptor.pdb",
  "input/peptide_chainB.pdb"
]

[topoaa]

[rigidbody]
tolerance = 20
sampling = 100
cmrest = true

[seletop]
select = 20

[flexref]
tolerance = 20
cmrest = true
fle_sta_1 = 1
fle_end_1 = 10
fle_seg_1 = "B"
ssdihed = "alphabeta"
mdsteps_rigid = 2000
mdsteps_cool1 = 2000
mdsteps_cool2 = 4000
mdsteps_cool3 = 4000

[caprieval]

[emref]
tolerance = 20
fle_sta_1 = 1
fle_end_1 = 10
fle_seg_1 = "B"
ssdihed = "alphabeta"

[caprieval]
allatoms = true
